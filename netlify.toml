# https://ntl.fyi/configure-secrets-scanning
#
# Turbopack Next build caches can contain inlined server env values in *.sst
# files. Those caches are not the published site. Omit them from secrets scan.
# Gemini/OpenRouter keys stay server-only (no NEXT_PUBLIC_*); omit the key names
# so Netlify doesn't fail when Next embeds them into serverless server chunks.

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_API_KEY,OPENROUTER_API_KEY,SUPABASE_ACCESS_TOKEN,SUPABASE_SERVICE_ROLE_KEY,BILL_PROCESS_SECRET,NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Utility catalog JSON is read at runtime while parsing bills.
  included_files = ["data/utilities/**"]
